seed: 42
model:
  vocab_size: 1024
  d_model: 32
  heads: 4
  stat_layers: 1
  har_layers: 1
  gnn_layers: 1
  ff_dim: 64
  dropout: 0.1
  max_nodes: 4
  max_tokens_per_node: 16
  max_context_tokens: 16
  num_jurisdictions: 2
  num_classes: 4
  conflict_threshold: 0.3
train:
  epochs: 2
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.01
  patience: 2
  warmup_fraction: 0.05
  lambda_cls: 1.0
  lambda_reg: 0.5
  lambda_gen: 0.3
  lambda_calib: 0.1
  lambda_conflict: 1.0
  num_workers: 0
  device: cpu
api:
  provider: mock
  model: claude-sonnet-4-6
  max_tokens: 256
