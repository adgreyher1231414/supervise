seed: 42
model:
  vocab_size: 32768
  d_model: 256
  heads: 4
  stat_layers: 3
  har_layers: 3
  gnn_layers: 2
  ff_dim: 1024
  dropout: 0.1
  max_nodes: 32
  max_tokens_per_node: 64
  max_context_tokens: 128
  num_jurisdictions: 8
  num_classes: 4
  conflict_threshold: 0.3
train:
  epochs: 30
  batch_size: 32
  lr: 0.0002
  weight_decay: 0.01
  patience: 5
  warmup_fraction: 0.05
  lambda_cls: 1.0
  lambda_reg: 0.5
  lambda_gen: 0.3
  lambda_calib: 0.1
  lambda_conflict: 1.0
  num_workers: 0
  device: auto
api:
  provider: mock
  model: claude-sonnet-4-6
  max_tokens: 256
  # Set provider: anthropic and ANTHROPIC_API_KEY for real calls.
